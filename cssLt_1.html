<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>

    <!-- Linking external CSS -->
    <link rel="stylesheet" href="cssLt_1.css">
</head>
<body>

    <header>
        <h1>Student Profile Page</h1>
    </header>

    <section class="profile-box">
        <!-- Working online image from Pexels -->
        <img src="https://images.pexels.com/photos/220453/pexels-photo-220453.jpeg" 
             alt="Student Photo" 
             class="profile-img">

        <h2 class="student-name">John Doe</h2>
        <p class="student-info"><strong>Department:</strong> Computer Science</p>
        <p class="student-info"><strong>Student ID:</strong> 21-12345-1</p>

        <p class="bio">
            Hello! I am John Doe, a passionate learner who loves programming, AI, and web
            development. I enjoy creating new projects and learning new technologies.
        </p>
    </section>

    <footer>
        <p>&copy; 2025 AIUB | Department of Computer Science</p>
    </footer>

</body>
</html>
