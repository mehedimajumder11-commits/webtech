<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donation Page</title>
  <link rel="stylesheet" href="labtask3.css">
</head>

<body>
  <form action="" method="POST">
    <h2>Donor Information</h2>

    <label for="donor-firstname">First Name:</label>
    <input type="text" id="donor-firstname" name="donor-firstname" required>

    <label for="donor-lastname">Last Name:</label>
    <input type="text" id="donor-lastname" name="donor-lastname" required>

    <label for="company">Company:</label>
    <input type="text" id="company" name="company">

    <label for="address1">Address 1:</label>
    <input type="text" id="address1" name="address1" required>

    <label for="address2">Address 2:</label>
    <input type="text" id="address2" name="address2">

    <label for="city">City:</label>
    <input type="text" id="city" name="city" required>

    <label for="state">State:</label>
    <select id="state" name="state" required>
      <option value="">Select a state</option>
      <option value="dhaka">Dhaka</option>
      <option value="washington">Washington</option>
      <option value="london">London</option>
    </select>

    <label for="zipcode">Zip Code:</label>
    <input type="text" id="zipcode" name="zipcode" required>

    <label for="country">Country:</label>
    <select id="country" name="country" required>
      <option value="">Select a country</option>
      <option value="bangladesh">Bangladesh</option>
      <option value="usa">USA</option>
      <option value="uk">UK</option>
    </select>

    <label for="phone">Phone:</label>
    <input type="tel" id="phone" name="phone">

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>

    <h2>Donation Details</h2>

    <label for="donationamount">Donation Amount:</label>
    <div class="donationamount">
      <input type="radio" id="amount-50" name="donationamount" value="50" required>
      <label for="amount-50">$50</label>

      <input type="radio" id="amount-100" name="donationamount" value="100">
      <label for="amount-100">$100</label>

      <input type="radio" id="amount-250" name="donationamount" value="250">
      <label for="amount-250">$250</label>

      <input type="radio" id="other" name="donationamount" value="other">
      <label for="other">Other</label>
    </div>

    <label for="otheramount">Other Amount ($):</label>
    <input type="number" id="otheramount" name="otheramount" placeholder="Enter custom amount">

    <label for="recurringdonation">Recurring Donation:</label>
    <input type="checkbox" id="recurringdonation" name="recurringdonation">
    <label for="recurringdonation">I want to donate monthly</label>

    <h2>Additional Information</h2>
    <label for="comments">Comments:</label>
    <textarea id="comments" name="comments" rows="4" placeholder="Type your feedback or message"></textarea>

    <div class="button-group">
      <button type="reset">Reset</button>
      <button type="submit">Continue</button>
    </div>

    <p class="notice">Donate online with confidence. You are on a secure server.</p>
  </form>
</body>
</html>
